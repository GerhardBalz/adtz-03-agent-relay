# Agent Relay API + dashboard. Uses the image built from the repo Dockerfile
# and loaded into kind with: kind load docker-image agent-relay:local
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
    app.kubernetes.io/part-of: agent-relay
spec:
  selector:
    app.kubernetes.io/name: agent-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
    app.kubernetes.io/part-of: agent-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-relay
        app.kubernetes.io/part-of: agent-relay
    spec:
      # main.py runs init_db() at import, so hold the app until PostgreSQL
      # accepts connections instead of crash-looping (compose's depends_on).
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U agent_relay -d agent_relay; do echo waiting for postgres; sleep 2; done
      containers:
        - name: agent-relay
          image: agent-relay:local
          # The image exists only inside kind's node; never try a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # `postgres` resolves to the PostgreSQL Service in this namespace.
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://agent_relay:$(POSTGRES_PASSWORD)@postgres:5432/agent_relay
            # Optional: create Secret `agent-relay-enrollment` with key
            # `secret` to require X-Enrollment-Secret on registration.
            - name: RELAY_ENROLLMENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-relay-enrollment
                  key: secret
                  optional: true
          # /ready returns 503 until PostgreSQL is reachable and the relay's
          # tables exist, so the Service only routes to a working pod.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
